[package]
name = "purple-rs"
version = "0.1.0"
edition = "2024"
description = "A port of hmftools PURPLE 4.5 (purity, ploidy and copy number estimation) to Rust"

[[bin]]
name = "purple-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hmf-common = { path = "../hmf-common-rs" }
hmf-plot = { package = "hmf-plot-rs", path = "../hmf-plot-rs" }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
