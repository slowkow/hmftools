[package]
name = "sage-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
core-math = "1.4.0"
flate2 = "1.1.11"
libm = "0.2.16"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }

[features]
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
