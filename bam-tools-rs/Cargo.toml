[package]
name = "bam-tools-rs"
version = "0.1.0"
edition = "2024"
description = "BamTools metrics (hmftools BamTools 1.6.2 BamMetrics) in Rust"

[[bin]]
name = "bam-tools-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hmf-common = { path = "../hmf-common-rs" }
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }

[features]
default = ["mimalloc"]
# a faster allocator; build with --no-default-features to use the system one
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
