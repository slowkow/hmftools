[package]
name = "amber-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
core-math = "1.4.0"
# zlib, as Java's java.util.zip: the same deflate bytes, so the gzip and BGZF files and the tabix
# index (whose last chunk ends at a compressed offset) come out as Java writes them
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
hmf-common = { path = "../hmf-common-rs" }
libm = "0.2.16"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }

[features]
default = ["mimalloc"]
# a faster allocator; build with --no-default-features to use the system one
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
