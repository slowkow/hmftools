[package]
name = "qsee-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of hmftools qsee 1.0: QC features of the pipeline outputs, QC statuses and the gene limit of detection"

[[bin]]
name = "qsee-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hmf-common = { path = "../hmf-common-rs" }
# the visual report (PNG with BUI's raster, PDF with the pdf module)
hmf-plot = { package = "hmf-plot-rs", path = "../hmf-plot-rs", features = ["pdf"] }

[profile.release]
panic = "abort"
debug = 1
