[package]
name = "hmf-common"
version = "0.1.0"
edition = "2024"
description = "Code shared by the Rust ports of hmftools"

[lib]
name = "hmf_common"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
core-math = "1.4.0"
# zlib, as Java's java.util.zip: the same deflate bytes, so BGZF files and tabix indexes come out as
# htsjdk writes them (vcf)
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
memchr = "2.8.3"
# fast inflating of gzip resource files (gz)
zlib-rs = "0.6.7"
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }

[build-dependencies]
# builds the vendored BWA-MEM sources (vendor/bwa) with the `bwa` feature
cc = { version = "1", optional = true }

[features]
# the `bwa` module: BWA-MEM alignment through the vendored library, as gatk-bwamem-jni does it
bwa = ["dep:cc"]
