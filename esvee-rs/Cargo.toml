[package]
name = "esvee-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.11"
hashbrown = "0.17.1"
libm = "0.2.16"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
zlib-rs = "0.6.7"
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }

[build-dependencies]
# the assembly step builds the vendored BWA-MEM sources (vendor/bwa)
cc = "1"

[features]
default = ["mimalloc"]
# a faster allocator; build with --no-default-features to use the system one
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
