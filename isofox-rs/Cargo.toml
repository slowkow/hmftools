[package]
name = "isofox-rs"
version = "0.1.0"
edition = "2024"
description = "A port of hmftools ISOFOX 2.1 and 2.0.1 (RNA-seq transcript expression, novel splice junctions, retained introns and fusions) to Rust"

[[bin]]
name = "isofox-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hmf-common = { path = "../hmf-common-rs" }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
rust-htslib = { version = "1.0.2", default-features = false, features = ["libdeflate", "bzip2", "lzma"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[profile.release]
panic = "abort"
debug = 1
