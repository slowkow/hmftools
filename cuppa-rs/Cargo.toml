[package]
name = "cuppa-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of hmftools CUPPA 2.5: cancer of unknown primary prediction (feature extraction and pycuppa's classifier), without Java or Python"

[[bin]]
name = "cuppa-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# java.util.zip's deflate (zlib) for the .tsv.gz written as Java writes it, and gzip reading
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
hmf-common = { path = "../hmf-common-rs" }
# the summary plot (PNG with BUI's raster, the cohort PDF with the pdf module)
hmf-plot = { package = "hmf-plot-rs", path = "../hmf-plot-rs", features = ["pdf"] }

[profile.release]
debug = 1
